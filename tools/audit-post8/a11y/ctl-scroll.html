<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;overflow:hidden;height:100vh}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{max-width:620px;width:100%;max-height:82vh;overflow-y:auto;padding:26px 30px 30px;position:relative;background:#222;color:#eee}
p{line-height:1.6}
</style></head><body>
<div id="modal" role="dialog" aria-modal="true"><div class="sheet" tabindex="-1"><button id="close">x</button>
<div id="body" tabindex="0" role="region" aria-label="text"></div></div></div>
<script>var b=document.getElementById("body"); for(var i=0;i<300;i++){ var p=document.createElement("p"); p.textContent="Paragraph "+i+" lorem ipsum dolor sit amet, consectetur adipiscing elit."; b.appendChild(p); } document.getElementById("close").focus();</script>
</body></html>
